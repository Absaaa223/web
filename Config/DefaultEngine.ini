; ---------------------------------------------------------------------------
; DUST // Beyond the Horizon - engine configuration
;
; This file is the render target definition for the whole project. Anything
; here that a designer might reasonably want to change at runtime is also
; exposed through UDustGameUserSettings; anything here that is NOT exposed is a
; decision we have made on the player's behalf and do not intend to revisit.
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Dust/Maps/L_Dust_Persistent.L_Dust_Persistent
EditorStartupMap=/Game/Dust/Maps/L_Dust_Persistent.L_Dust_Persistent
GlobalDefaultGameMode=/Script/Dust.DustGameMode
TransitionMap=

[/Script/Engine.RendererSettings]

; --- Global illumination ----------------------------------------------------
; Lumen. The desert is a single enormous bounce surface: sunlight hitting sand
; and bouncing up into everything above it is most of what the lighting *is*,
; and no baked solution survives a sun that moves and dunes that migrate.
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.RadianceCache=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.DownsampleFactor=16

; Distant scenes need the far field: our sightlines run to 9 km and Lumen's
; default scene bounds stop contributing long before that.
r.LumenScene.FarField=1
r.LumenScene.FarField.MaxTraceDistance=1500000.0

; --- Reflections ------------------------------------------------------------
; Lumen reflections by default; hardware ray tracing where the GPU supports it.
; Water in the oases and wet salt crust after rain are the two surfaces that
; genuinely need accurate reflections, and both are rare enough that the cost
; is acceptable.
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=2
r.RayTracing=True
r.RayTracing.Reflections.MaxRoughness=0.6
r.RayTracing.Shadows=0

; --- Shadows ----------------------------------------------------------------
; Virtual shadow maps. A 10 km world with a single directional light and no
; baking has no other viable answer, and VSM's page pool handles the extreme
; depth range from a footprint rim to a mountain 8 km away.
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

; The page pool is sized for the worst case we ship: standing on a mesa at
; golden hour with the whole valley in frame and every rock casting.
r.Shadow.Virtual.MaxPhysicalPages=6144

; --- Geometry ---------------------------------------------------------------
; Nanite. Rock formations are the single largest triangle budget in the game
; and Nanite removes the LOD authoring problem entirely for them.
r.Nanite=1
r.Nanite.ProjectEnabled=True
r.Nanite.MaxPixelsPerEdge=1.0

; --- Distance fields --------------------------------------------------------
; Required by Lumen's mesh tracing, by the terrain's ambient occlusion, and by
; the fauna navigation queries that need to know about geometry that is not
; streamed in.
r.GenerateMeshDistanceFields=True
r.DistanceFieldBuild.EightBit=True
r.DistanceFields.MaxPerMeshResolution=256
r.AOGlobalDistanceField=1
r.AOGlobalDistanceFieldNumClipmaps=5

; --- Anti-aliasing and upscaling -------------------------------------------
; TSR is the default because it is vendor-neutral and holds up on the two
; hardest things in this game: fine particulate in a sandstorm, and the
; high-frequency ripple detail on a dune face at grazing angles.
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1
r.ScreenPercentage=66

; Dynamic resolution is off by default and enabled by the user selecting the
; DynamicResolution quality tier; the performance governor drives it from there.
r.DynamicRes.OperationMode=0
r.DynamicRes.MinScreenPercentage=66
r.DynamicRes.MaxScreenPercentage=100

; --- Atmosphere and volumetrics --------------------------------------------
r.SkyAtmosphere=1
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.ShadowViewRaySampleMaxCount=80
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128

; --- Post ------------------------------------------------------------------
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=1
r.MotionBlurQuality=4
r.DefaultFeature.Bloom=1
r.Bloom.Cross=0.0

; Extended luminance range is mandatory: a desert at noon and a moonless night
; are roughly six orders of magnitude apart and the default range cannot
; represent both without one of them being a lie.
r.DefaultFeature.LensFlare=0

; --- Colour and HDR ---------------------------------------------------------
r.AllowHDR=1
r.HDR.Display.OutputDevice=3
r.HDR.Display.ColorGamut=2
r.HDR.Display.MaxLuminance=1000

; ACES-derived tonemapping. The default filmic curve crushes the deep shadow
; detail that DUST's nights depend on.
r.TonemapperFilm=1
r.Tonemapper.Sharpen=0.4

; --- Materials --------------------------------------------------------------
r.SubstrateEnable=0
r.Material.RoughnessToAlpha=1
r.SeparateTranslucency=1

; --- Foliage and instancing -------------------------------------------------
foliage.LODDistanceScale=1.0
grass.DensityScale=1.0
foliage.MinimumScreenSize=0.0005

; --- World partition and streaming -----------------------------------------
wp.Runtime.EnableServerStreaming=0
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1
s.LevelStreamingActorsUpdateTimeLimit=2.0
s.UnregisterComponentsTimeLimit=2.0

; --- Physics ----------------------------------------------------------------
p.Chaos.Solver.Joint.MinSolverStiffness=0.001
p.Chaos.DebugDraw.Enabled=0

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4
; Sub-stepping matters for the hoverbike and for rope constraints, both of
; which are stiff systems that visibly jitter at a variable 60 Hz.

[/Script/Engine.Engine]
NearClipPlane=8.000000
; A near plane this tight is what allows the extreme close-up compositions -
; a hand in front of a distant mesa - that the art direction is built on.

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInGame=2162688
gc.TimeBetweenPurgingPendingKillObjects=90
; Long GC interval: DUST creates and destroys creature pawns constantly, and a
; frequent purge produces a visible hitch every time a herd promotes.

[/Script/Engine.UserInterfaceSettings]
bAllowHighDPIInGameMode=True
ApplicationScale=1.000000

[/Script/Engine.RendererOverrideSettings]
bSupportAllShaderPermutations=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6


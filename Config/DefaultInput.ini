; ---------------------------------------------------------------------------
; DUST // Beyond the Horizon - input
;
; Bindings live in Enhanced Input assets (generated by the DustBootstrap
; commandlet, see Tools/RunCommandlet.sh). This file holds the axis and device
; configuration that has to exist before those assets load, plus the defaults
; the rebinding UI resets to.
;
; DESIGN NOTE
; The traversal button is deliberately context-sensitive rather than being
; split into jump / mantle / climb / grab. In a game whose subject is looking
; at the horizon, the player should never be looking at their hands.
; ---------------------------------------------------------------------------

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bAlwaysShowTouchInterface=False
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; Mouse smoothing off. It is the single most common cause of a camera feeling
; "floaty", and DUST's camera does its own damping in the camera component
; where the amount is under player control.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; --- Gamepad --------------------------------------------------------------
; Dead zones tuned for worn hardware. A player 200 hours into a Deck's life
; should not have their camera drift while they compose a photograph.
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.200000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.200000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.180000,Sensitivity=1.000000,Exponent=2.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.180000,Sensitivity=1.000000,Exponent=2.000000,bInvert=False))

; Exponent 2 on the look axes gives fine control near centre for framing a shot
; and full speed at the edge for whipping around when something moves.

+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))

; ---------------------------------------------------------------------------
; Default bindings, mirrored by the rebinding UI's Reset to Defaults.
; Every one of these is remappable; none are hard-coded anywhere in C++.
; ---------------------------------------------------------------------------

; Move                W A S D           / Left stick
; Look                Mouse             / Right stick
; Traverse            Space             / Gamepad_FaceButton_Bottom
;                     (jump, mantle, vault, climb, grab rope - context decides)
; Sprint              Left Shift (hold) / Gamepad_LeftShoulder
; Crouch              Left Ctrl         / Gamepad_RightThumbstick
; Interact            E                 / Gamepad_FaceButton_Left
; Glider              G                 / Gamepad_FaceButton_Top
; Board               B                 / Gamepad_DPad_Down
; Camera toggle       V                 / Gamepad_DPad_Up
; Journal             J                 / Gamepad_Special_Left
; Photo mode          P                 / Gamepad_DPad_Right
; Menu                Escape            / Gamepad_Special_Right

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=True
bSendTriggeredEventsWhenInputIsFlushed=False

; User settings on: this is what backs the rebinding UI and persists a player's
; layout through Steam Cloud alongside their save.

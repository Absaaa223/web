; ---------------------------------------------------------------------------
; DUST // Beyond the Horizon - game configuration
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=DUST // Beyond the Horizon
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "DUST")
Description=You wake in the sand. Nobody explains why.
ProjectVersion=0.1.0
bStartInVR=False

[/Script/DustCore.DustDeveloperSettings]

; --- World ------------------------------------------------------------------
; The seed. Changing this regenerates the entire world and invalidates every
; save in existence, so it is frozen for the life of the project.
MasterSeed=19770820

; 500,000 cm x 10 = 5 km half-extent, giving a 10 x 10 km world = 100 km2.
WorldHalfExtent=5000000.000000
WorldBoundaryFalloff=400000.000000
StreamingCellSize=25600.000000
bUseOriginRebasing=True
OriginRebaseThreshold=200000.000000

; --- Simulation budgets -----------------------------------------------------
; Tuned against the worst case: standing at the oasis at dawn during a
; migration, with two herds visible and a predator working the treeline.
MaxFullFidelityCreatures=24
MaxLowFidelityCreatures=240
SamplerPrefetchBudgetMs=0.600000
CuriosityBudgetMs=0.300000

; --- Survival ---------------------------------------------------------------
; Deliberately generous. See Docs/GDD.md - survival exists to shape routes,
; not to punish, and every one of these numbers errs toward forgiveness.
SprintSecondsAtFullStamina=22.000000
HoursToParched=3.500000
bForgivingSurvival=True

; --- Discovery --------------------------------------------------------------
; The curiosity director guarantees something unresolved within 900 m at all
; times. The offline validator fails the build if more than 2% of the world
; cannot meet this.
GuaranteedInterestRadius=90000.000000
MinimumInterestSeparation=22000.000000

; --- Save -------------------------------------------------------------------
AutosaveIntervalSeconds=180.000000
AutosaveSlotCount=3
ManualSlotCount=12

; --- Debug ------------------------------------------------------------------
bEnableDeveloperOverlays=True

[/Script/Engine.AssetManagerSettings]
; Primary asset types the runtime discovers rather than hard-references, so
; adding a region, a species or a weather condition is a content operation.
+PrimaryAssetTypesToScan=(PrimaryAssetType="DustRegion",AssetBaseClass="/Script/DustWorld.DustRegionData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Dust/World/Regions")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="DustSpecies",AssetBaseClass="/Script/DustFauna.DustSpeciesData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Dust/Fauna/Species")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="DustWeatherPreset",AssetBaseClass="/Script/DustWeather.DustWeatherPreset",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Dust/Weather/Presets")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True

+DirectoriesToAlwaysCook=(Path="/Game/Dust/World")
+DirectoriesToAlwaysCook=(Path="/Game/Dust/Fauna")
+DirectoriesToAlwaysCook=(Path="/Game/Dust/Weather")
+DirectoriesToAlwaysCook=(Path="/Game/Dust/Materials/Collections")

+DirectoriesToNeverCook=(Path="/Game/Dust/Developer")
+DirectoriesToNeverCook=(Path="/Game/Dust/Test")

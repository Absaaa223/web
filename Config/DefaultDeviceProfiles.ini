; ---------------------------------------------------------------------------
; DUST // Beyond the Horizon - device profiles
;
; Per-platform baselines. The performance governor sits on top of these and
; trades quality within the profile; the profile itself is the floor.
; ---------------------------------------------------------------------------

[/Script/Engine.DeviceProfileManager]
+DeviceProfileNameAndTypes=Windows,Windows
+DeviceProfileNameAndTypes=WindowsHighEnd,Windows
+DeviceProfileNameAndTypes=SteamDeck,Windows
+DeviceProfileNameAndTypes=Linux,Linux
+DeviceProfileNameAndTypes=Mac,Mac

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
+CVars=r.Streaming.PoolSize=2200
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.Streaming.UseAllMips=0

; Texture streaming has to be conservative here because DUST's worst case is
; not a dense interior - it is a mesa vista where forty distinct rock materials
; are all visible at once at full mip.
+CVars=r.Streaming.FramesForFullUpdate=1
+CVars=r.Streaming.MaxTempMemoryAllowed=128

[WindowsHighEnd DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.Streaming.PoolSize=4600
+CVars=r.Lumen.HardwareRayTracing=1
+CVars=r.RayTracing.Reflections.MaxRoughness=0.6
+CVars=r.Shadow.Virtual.MaxPhysicalPages=8192
+CVars=r.VolumetricCloud.ViewRaySampleMaxCount=1024

[SteamDeck DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=t.MaxFPS=60
+CVars=r.Streaming.PoolSize=1100
+CVars=r.Streaming.LimitPoolSizeToVRAM=1

; The Deck's unified memory means the streaming pool competes with everything
; else. 1100 MB is what remains after the world partition cells, the ecology
; and the sand field have taken their share, measured rather than guessed.
+CVars=r.ScreenPercentage=58
+CVars=r.MotionBlurQuality=0

[Linux DeviceProfile]
DeviceType=Linux
BaseProfileName=
+CVars=r.Streaming.PoolSize=2200

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
+CVars=r.Streaming.PoolSize=2200

; Metal has no virtual shadow map path we are happy with at this scale yet, so
; Mac falls back to cascaded shadows with a long distance scale. Revisit when
; the platform's VSM support matures.
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.Shadow.DistanceScale=1.4
+CVars=r.Shadow.CSM.MaxCascades=4

; ---------------------------------------------------------------------------
; Steam Deck
;
; Verified against the worst case in the game: crossing the Screaming Flat
; during a full sandstorm with volumetric fog, maximum particulate and the
; horizon still readable. 800p, FSR Balanced, locked 60.
; ---------------------------------------------------------------------------
[SteamDeck DeviceProfile]
+CVars=r.ViewDistanceScale=0.9
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Shadow.Virtual.ResolutionLodBiasDirectional=1.5
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.Lumen.ScreenProbeGather.DownsampleFactor=32
+CVars=r.Lumen.TraceMeshSDFs=0
+CVars=r.LumenScene.FarField=0
+CVars=r.ReflectionMethod=2
+CVars=r.SSR.Quality=2
+CVars=r.VolumetricCloud.ViewRaySampleMaxCount=192
+CVars=r.VolumetricFog.GridPixelSize=16
+CVars=fx.Niagara.QualityLevel=1
+CVars=foliage.DensityScale=0.55
+CVars=grass.DensityScale=0.5
+CVars=r.Streaming.PoolSize=1100
+CVars=r.MaxAnisotropy=4
+CVars=r.MotionBlurQuality=0
+CVars=t.MaxFPS=60

; Sand deformation stays on: footprints are one of the most-photographed
; details in the game and the field is only 2 MB. It is the last thing we cut.
+CVars=dust.sand.Deformation=1

; Fewer creatures at full fidelity, but the coarse simulation is untouched -
; the ecology still runs, so the world is still alive when you look away.
+CVars=dust.fauna.PromotionDistance=16000

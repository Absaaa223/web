; ---------------------------------------------------------------------------
; DUST // Beyond the Horizon - scalability
;
; Five tiers, 0 to 4, plus a dedicated SteamDeck group. The ordering of what we
; give up is a design decision, documented in Docs/PERFORMANCE.md: silhouette
; legibility at distance is the game's navigation channel, so shadow and
; geometry range survive longer than resolution or particle count.
; ---------------------------------------------------------------------------

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.5
foliage.LODDistanceScale=0.5

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.75
foliage.LODDistanceScale=0.7

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=1.0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.4
foliage.LODDistanceScale=1.3

[ViewDistanceQuality@4]
r.SkeletalMeshLODBias=0
; 2.0 is not excessive here. The whole point of the world is that you can see
; where you are going from four kilometres away.
r.ViewDistanceScale=2.0
foliage.LODDistanceScale=1.8

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.6
r.Shadow.CSM.MaxCascades=2

[ShadowQuality@1]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.5
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.SMRT.RayCountDirectional=4

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.SMRT.RayCountDirectional=6

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.MaxPhysicalPages=6144
r.Shadow.Virtual.SMRT.RayCountDirectional=8

[ShadowQuality@4]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.MaxPhysicalPages=8192
r.Shadow.Virtual.SMRT.RayCountDirectional=12
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
; No Lumen at all on the lowest tier. A flat ambient term is honest; a broken
; Lumen at 4 samples is not.

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.TraceMeshSDFs=0
r.LumenScene.FarField=0

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=24
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.TraceMeshSDFs=1
r.LumenScene.FarField=1

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.TraceMeshSDFs=1
r.LumenScene.FarField=1

[GlobalIlluminationQuality@4]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.HardwareRayTracing=1
r.LumenScene.FarField=1
r.LumenScene.FarField.MaxTraceDistance=2000000.0

[ReflectionQuality@0]
r.ReflectionMethod=2
r.SSR.Quality=0

[ReflectionQuality@1]
r.ReflectionMethod=2
r.SSR.Quality=2

[ReflectionQuality@2]
